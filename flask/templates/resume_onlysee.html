<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../static/css/style.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- jQuery 라이브러리 -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- jQuery Cookie Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <!-- Bootstrap JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <title>ISC - 이력서 보기</title>
  </head>

  <body id="resume-body">
    <script
    src="https://kit.fontawesome.com/d5055e0a20.js"
    crossorigin="anonymous"
     ></script>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="status-bar__column">
        <span>18:43</span>
      </div>
      <div class="status-bar__column">
        <span>100%</span>
        <i class="fa-solid fa-battery-full fa-2x"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>
    <header class="top-screen-header">
      <div class="top-screen-header__column">
        <a onclick="go_home()">
          <i class="fa-solid fa-chevron-left fa-2x"></i>
        </a>
      </div>
      <div class="top-screen-header__column">
        <h1 class="top-screen-header__title">케어코디 이력서</h1>
      </div>
      <div class="top-screen-header__column">
        <span>
          <img
            class="top-screen-header-logo"
            src="../static/ISC-logo_trans.png"
          />
        </span>
      </div>
    </header>
    <main class="main-screen resume-screen">
      <form class="resume-introduction" action="/resume" method="POST" enctype="multipart/form-data">
        <!-- 기본 정보+이미지 -->
        <div id="basicAndimage-container">
          <div id="basic-container">
            <!-- 개인 정보를 입력-->
            <div class="resume-introduction__basic">
              <input
                type="hidden"
                name="resume_id"
                value="{{ resume._id if resume else '' }}"
                disabled
              />
              <!-- 이름 -->
              <label
                >이름<br /><input
                  type="text"
                  id="name"
                  name="name"
                  value="{{ resume.name if resume else '' }}"
                  placeholder="예시: 김순옥"
                  required
                  disabled
              /></label>
              <!-- 나이 -->
              <label
                >나이<br /><input
                  type="text"
                  id="age"
                  name="age"
                  value="{{ resume.age if resume else '' }}"
                  placeholder="예시: XX (세)"
                  required
                  disabled
              /></label>
              <!-- 성별 -->
              <label
                >성별<br />
                <select id="gender" name="gender" required disabled>
                  <option value="" {% if not resume or not resume.gender %}selected{% endif %}>선택</option>
                  <option value="Male" {% if resume and resume.gender == "Male" %}selected{% endif %}>남성</option>
                  <option value="Female" {% if resume and resume.gender == "Female" %}selected{% endif %}>여성</option>
                </select>
              </label>
              <!-- 경력 -->
              <label
                >경력<br/>
                <input
                  type="text"
                  id="experience"
                  name="experience"
                  value="{{ resume.experience if resume else '' }}"
                  placeholder="예시: X년 X월"
                  required
                  disabled
                />
              </label>
            </div>
          </div>
          <div id="image-container">
            <!-- 이미지를 업로드-->
            <div class="resume-introduction__image">
              {% if resume and resume.photo %}
              <img
                src="{{ url_for('static', filename=resume.photo) }}"
                alt="첨부된 사진"
                width="200"
              />
              {% else %}
              <img src="https://via.placeholder.com/200" alt="첨부된 사진" />
              {% endif %}
              <div class="resume-introduction__image__upload">
                <input
                  type="file"
                  id="photo"
                  name="photo"
                  accept="image/png, image/jpeg, image/jpg"
                  disabled
                />
              </div>
            </div>
          </div>
        </div>
        <!-- 자기소개 -->
        <div id="text-container">
          <input
          type="hidden"
          name="resume_id"
          value="{{ resume._id if resume else '' }}"
          disabled
          />
          <h2 class="resume-introduction__title">
            자기소개 (경력, 원하는 사항 등)
          </h2>
          <textarea
            class="resume-introduction__text"
            id="introduction"
            name="introduction"
            placeholder="자기소개를 입력해주세요."
            required
            disabled
          >{{ resume.introduction if resume else '' }}</textarea>
        </div>
        <!-- 제출 버튼 -->
        <div class="resume-btn">
          <button type="submit" data-nick="{{resume.nick}}" onclick = "send_match(this)"  disabled> {{ resume.nick }}님께 요청</button>
        </div>
      </form>
    </main>
    
  </body>
  
  <script>
    document.querySelector('button').disabled = false;

    function go_home() {
      window.location.href = "/match_find";
    }

    //매칭 요청을 보냄
    function send_match(element) {
      event.preventDefault();
      console.log(element.dataset.nick); 
      $.ajax({
        type: 'POST',
        url: '/api/send_match',
        data: {
          nick_give: element.dataset.nick
        },
        success: function (response) {
          console.log(response)
          if (response['result'] == 'success') {
            // 요청에 성공시 알림
            alert('매칭 요청 완료!')
            //메인 페이지로 이동
            window.location.href = '/main'
          } else {
            alert(response['msg'])
            window.location.href = '/main'
          }
        }
      })
    }
  </script>
   
</html>
