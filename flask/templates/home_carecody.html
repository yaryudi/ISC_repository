<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../static/css/style.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- jQuery 라이브러리 -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- jQuery Cookie Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <!-- Bootstrap JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <title>ISC - 케어코디 홈</title>
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>No Service</span>
        <!-- To Do: wifi-icon -->
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="status-bar__column">
        <span>18:49</span>
      </div>
      <div class="status-bar__column">
        <span>100%</span>
        <!-- battery icon -->
        <i class="fa-solid fa-battery-full fa-2x"></i>
        <!-- lightning icon -->
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>
    <div id="home">
      <header class="main-screen-header">
        <div class="main-screen-header__icons">
          <img
            class="main-screen-header-logo"
            src="../static/ISC-logo_trans.png"
          />
        </div>
        <div class="main-screen-header__title">
          {{ role }} {{ username }}님 반갑습니다.
        </div>
        <div class="resume-btn" onclick="logout()">로그아웃</div>
      </header>
    </div>

    <main class="main-screen" id="home-screen">
      <div class="isMatchComplete">
        <span class="isMatchComplete__basic">
          * 매칭이
          <span class="isMatchComplete__detail">{{ word }}</span>
        </span>
      </div>
      <div class="user-component">
        <div class="user-component__column">
          <img
            class="user-component__avatar user-component__avatar--xl"
            src="{{ url_for('static', filename=codi_info.photo) }}"
          />
          <div class="user-component__text">
            <h4 class="user-component__title">
              {{ codi_info.nick }}({{ codi_info.name }})
            </h4>
            <h6 class="user-component__subtitle">
              안녕하세요. 케어 코디
              <spaan class="highlight">{{ codi_info.name }}</spaan>님!
              <br />오늘도 시니어 분들과 좋은 동행 부탁드립니다.
            </h6>
          </div>
        </div>
      </div>

      <div class="to-do-list-section">
        <h2 class="to-do-list-section__title">To-Do 리스트</h2>
        <ul class="to-do-list-section__contents" id="to-do-list"></ul>
      </div>
    </main>

    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__btn">
          <a class="nav__link" href="#" onclick="match_check()">
            <i class="fa-regular fa-handshake fa-2x"></i>
            <span>요청 확인</span>
          </a>
        </li>

        <li class="nav__btn">
          <a class="nav__link" onclick="go_chat_with_mate() ">
            <i class="fa-regular fa-message fa-2x"></i>
            <span>케톡!</span>
          </a>
        </li>
        <li class="nav__btn">
          <!-- 정현 -->
          <a class="nav__link" onclick="todo_carecody()">
            <i class="fa-regular fa-clipboard fa-2x"></i>
            <span>돌봄 기록</span>
          </a>
        </li>
        <!-- 정현 -->
        <li class="nav__btn">
          <a class="nav__link" onclick="go_senior_set()">
            <i class="fa-regular fa-file fa-2x"></i>
            <span>이력서 관리</span></a
          >
        </li>
      </ul>
    </nav>
    <script
      src="https://kit.fontawesome.com/d5055e0a20.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

<script>
  window.onload = function () {
    main_check_info_update();
    
  };

  function main_check_info_update() {
    console.log($("#nickname").text());
    console.log("Requesting todo list update...");
    $.ajax({
      type: "POST",
      url: "/api/main_check_info_update",
      data: {
        nick_give: $("#nickname").text(),
      },
      success: function (response) {
        console.log(response);
        if (response["result"] == "success") {
          alert("업데이트 완료!");
          const data = response.data;
          if (data) {
            // 서비스 리스트를 선택
            const serviceList = $("#to-do-list");
            serviceList.empty(); // 기존 리스트 항목들 제거

            // content와 comment 각각 리스트로 가져오기
            const contents = data.todo_list_content;
            const comments = data.todo_list_comment;
            console.log(comments);

            // content와 comment를 합쳐서 리스트 항목으로 추가
            contents.forEach((content, index) => {
              let li;
              if (comments[index] && comments[index].trim() !== "") {
                // comment가 비어있지 않은 경우
                li = $('<li class="completed"></li>').text(
                  `${content} - ${comments[index]}`
                );
              } else {
                // comment가 비어있는 경우
                li = $("<li></li>").text(`${content} - ${comments[index]}`);
              }
              serviceList.append(li); // jQuery의 append 사용
            });
          }
        } else {
          alert(response["msg"]);
          window.location.pathname = "/main";
        }
      },
      error: function (xhr, status, error) {
        console.error(`Error: ${status}, ${error}`);
        alert(response["msg"]);
      },
    });
  }

  //매칭 보기 - 디버깅 용
  function go_match() {
    window.location.href = "/match";
  }

  //매칭 확인하기 - 자신에게 온 매칭을 확인한다.
  function match_check() {
    window.location.href = "/match_check";
  }

  //시니어 정보 보기
  function go_senior_set() {
    window.location.href = "/resume";
  }

  function logout() {
    // 먼저 인증 여부를 확인
    $.ajax({
      type: "GET",
      url: "/api/isAuth",
      success: function (response) {
        if (response["result"] === "success") {
          // 인증이 확인된 경우 로그아웃 요청을 보냄
          $.ajax({
            type: "POST",
            url: "/api/logout",
            success: function (response) {
              if (response["result"] === "success") {
                alert(response["msg"]);
                window.location.href = "/"; // 홈 화면으로 리디렉션
              } else {
                alert("로그아웃 중 오류가 발생했습니다.");
              }
            },
            error: function () {
              alert("서버와 통신 중 오류가 발생했습니다.");
            },
          });
        } else {
          // 인증이 실패한 경우 초기 화면으로 리디렉션
          alert(response["msg"]);
          window.location.href = "/";
        }
      },
      error: function () {
        alert("서버와 통신 중 오류가 발생했습니다.");
      },
    });
  }

  function todo_carecody() {
    window.location.href = "/todo_carecody";
  }

  //mate와 채팅하기
  function go_chat_with_mate() {
    $.ajax({
      type: "POST",
      url: "/api/findchatroom_mate",
      data: {
        id_give: $("#input-id").val(),
      },
      success: function (response) {
        console.log(response);
        if (response["result"] == "success") {
          // 방찾기에 성공하면 chattoken을 쿠키에 저장!!!! -> 클라이언트는 chattoken, usertoken이라는 2개의 토큰을 가지게 된다.
          $.cookie("chattoken", response["token"]);
          alert(response["msg"]);

          //채팅 페이지로 이동 - 채팅방의 데이터를 토큰과 db를 통해 가져온다.
          window.location.href = "/inroom";
        } else {
          //오류 발생 시 해당 페이지에 그대로 있는다.
          alert(response["msg"]);
        }
      },
    });
  }
</script>
